
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activity 1 · Read and answer | The Soundtrack of Your Life</title><style>
:root{--navy:#16294a;--blue:#1f65a6;--sky:#eaf4ff;--gold:#f4bf48;--paper:#fff;--ink:#1b2430;--muted:#556070;--line:#cbd7e4}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#edf5ff,#fff8e8);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.55}
main{max-width:980px;margin:0 auto;padding:16px}.top{background:var(--navy);color:#fff;padding:24px;border-radius:18px 18px 0 0}
.kicker{text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;color:#cfe4ff;font-weight:700}.top h1{margin:.25rem 0;font-size:clamp(1.65rem,4vw,2.7rem);line-height:1.15}.top p{margin:.4rem 0 0;color:#e6eef8}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.toolbar button,.nav button{border:1px solid #a8c2df;border-radius:999px;background:#fff;color:var(--navy);padding:8px 12px;font-weight:700;cursor:pointer}
button:focus,input:focus,textarea:focus,select:focus{outline:3px solid var(--gold);outline-offset:2px}
.panel{background:var(--paper);padding:clamp(16px,4vw,30px);border-radius:0 0 18px 18px;box-shadow:0 10px 30px #17365d12;min-height:400px}
h2{color:var(--navy);margin-top:0}h3{color:#244e7e}.tag{display:inline-block;background:var(--sky);color:#174c82;border-radius:6px;padding:3px 8px;font-size:.82rem;font-weight:bold}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0;background:#fff}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer}
button.secondary{background:#fff;color:var(--navy);border:1px solid #9cb6d2;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}
.options{display:grid;gap:9px;margin:12px 0}.option{display:flex;gap:10px;border:1px solid var(--line);border-radius:9px;padding:10px;align-items:flex-start}.option:hover{background:#f3f8ff}.option input{margin-top:5px}
input[type=text],textarea,select{width:100%;padding:11px;border:1px solid #9caebf;border-radius:8px;background:#fff;color:#172234;font:inherit}
textarea{min-height:115px;resize:vertical}
.feedback{margin-top:12px;padding:12px;border-radius:8px;display:none}.feedback.good{display:block;background:#e5f6ec;color:#155c3d;border:1px solid #92d6ae}.feedback.bad{display:block;background:#fff0f0;color:#8b1c2b;border:1px solid #e6a9af}.feedback.neutral{display:block;background:#eef5ff;color:#183b63;border:1px solid #b8d1ed}
.audio-box{background:#f2f8ff;border-left:4px solid var(--blue);padding:12px;border-radius:8px;margin:12px 0}.transcript{display:none;background:#f8fafc;border:1px dashed #90a2b6;border-radius:8px;padding:12px;margin-top:8px}
.wordgrid{display:flex;flex-wrap:wrap;gap:9px}.wordgrid label{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#fff}
.pairs{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;align-items:center}.pairs .word{font-weight:700}.footer{margin-top:18px;font-size:.88rem;color:var(--muted)}
.highcontrast{--navy:#000;--blue:#003fcc;--sky:#fff5b5;--ink:#000;--muted:#222;--line:#333}.largefont{font-size:1.18rem}
@media(max-width:640px){main{padding:8px}.top{padding:18px}.panel{padding:15px}.pairs{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main id="app"></main><script>
const task={"file": "05_reading_comprehension.html", "section": "READING", "title": "Activity 1 · Read and answer", "desc": "Read the short text “My Favorite Song” and choose the correct answer.", "type": "quiz", "passage": "Hello! My name is Carlos. My favorite song is “Waka Waka”. The singer is Shakira. It is a happy song. I listen to this song with my friends. We dance and sing together. I like it because it is fun and energetic.", "questions": [{"q": "What is Carlos’s favorite song?", "opts": ["Waka Waka", "Happy Birthday", "La Bicicleta"], "correct": 0, "why": "The text says his favorite song is “Waka Waka.”"}, {"q": "Who is the singer?", "opts": ["Carlos Vives", "Shakira", "Ana"], "correct": 1, "why": "The text identifies Shakira as the singer."}, {"q": "Is the song sad?", "opts": ["Yes, it is.", "No, it is happy.", "The text does not say."], "correct": 1, "why": "The text describes it as a happy song."}, {"q": "Who does Carlos listen with?", "opts": ["His teacher", "His family", "His friends"], "correct": 2, "why": "Carlos listens to the song with his friends."}, {"q": "Why does he like the song?", "opts": ["It is fun and energetic.", "It is very quiet.", "It is difficult."], "correct": 0, "why": "Carlos says it is fun and energetic."}]};
const app=document.getElementById("app");
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");}
function feedback(id,ok,msg){let e=document.getElementById(id);if(!e)return;e.className="feedback "+(ok===true?"good":ok===false?"bad":"neutral");e.style.display="block";e.textContent=msg;}
function speak(text){if(!("speechSynthesis" in window)){alert("Audio playback is not supported in this browser. Please use the transcript.");return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.86;speechSynthesis.speak(u);}
function toggleTranscript(){let e=document.getElementById("transcript");e.style.display=e.style.display==="block"?"none":"block";}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();}
function header(){return `<header class="top"><div class="kicker">Materials Design in EFL · A1–A2</div><h1>The Soundtrack of Your Life</h1><p>Music, preferences, listening and speaking practice</p><div class="toolbar"><button class="secondary" onclick="document.body.classList.toggle('largefont')">A+ Text size</button><button class="secondary" onclick="document.body.classList.toggle('highcontrast')">High contrast</button></div></header>`;}
function quiz(){return task.questions.map((q,i)=>`<section class="card"><h3>${i+1}. ${esc(q.q)}</h3><div class="options">${q.opts.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"><span>${esc(o)}</span></label>`).join("")}</div><button class="primary" onclick="checkQuiz(${i})">Check answer</button><div id="fb${i}" class="feedback" role="status"></div></section>`).join("");}
function checkQuiz(i){let q=task.questions[i],s=document.querySelector(`input[name="q${i}"]:checked`);if(!s){feedback("fb"+i,null,"Choose an answer first.");return;}let ok=Number(s.value)===q.correct;feedback("fb"+i,ok,(ok?"Correct! ":"Not quite. ")+q.why);}
function textcheck(){return task.questions.map((q,i)=>`<section class="card"><h3>${i+1}. Arrange these words</h3><p><span class="tag">${esc(q.q)}</span></p><label for="tx${i}">Type the sentence:</label><input id="tx${i}" type="text"><button class="primary" style="margin-top:10px" onclick="checkText(${i})">Check sentence</button><div id="fb${i}" class="feedback" role="status"></div></section>`).join("");}
function checkText(i){let q=task.questions[i],v=document.getElementById("tx"+i).value;if(!v.trim()){feedback("fb"+i,null,"Type your sentence first.");return;}let ok=norm(v)===norm(q.answer);feedback("fb"+i,ok,(ok?"Well done! ":"Review the word order. ")+q.why+" Model: "+q.answer);}
function audioBox(){return `<div class="audio-box"><strong>Listen to the text</strong><p>Press Play to listen. You may also show the transcript.</p><button class="primary" onclick="speak(task.audio)">▶ Play audio</button> <button class="secondary" onclick="toggleTranscript()">Show / hide transcript</button><div class="transcript" id="transcript">${esc(task.transcript||task.audio||"")}</div></div>`;}
function tf(){return audioBox()+task.questions.map((q,i)=>`<section class="card"><h3>${i+1}. ${esc(q.q)}</h3><div class="options"><label class="option"><input type="radio" name="tf${i}" value="true"><span>True</span></label><label class="option"><input type="radio" name="tf${i}" value="false"><span>False</span></label></div><button class="primary" onclick="checkTF(${i})">Check answer</button><div id="fb${i}" class="feedback" role="status"></div></section>`).join("");}
function checkTF(i){let q=task.questions[i],s=document.querySelector(`input[name="tf${i}"]:checked`);if(!s){feedback("fb"+i,null,"Choose True or False first.");return;}let ok=(s.value==="true")===q.correct;feedback("fb"+i,ok,(ok?"Correct! ":"Try again. ")+q.why);}
function multiselect(){return audioBox()+"<p>Select every word you hear.</p><div class='wordgrid'>"+task.choices.map((w,i)=>`<label><input type="checkbox" value="${esc(w)}" id="w${i}"> ${esc(w)}</label>`).join("")+"</div><p><button class='primary' onclick='checkMulti()'>Check selected words</button></p><div id='fbmulti' class='feedback' role='status'></div>";}
function checkMulti(){let selected=[...document.querySelectorAll(".wordgrid input:checked")].map(x=>x.value),correct=task.correct,good=selected.filter(x=>correct.includes(x)).length,falsePos=selected.filter(x=>!correct.includes(x)).length,ok=good===correct.length&&falsePos===0;feedback("fbmulti",ok,ok?"Excellent! You selected every word heard.":`You found ${good} of ${correct.length} words and selected ${falsePos} extra. Listen again and try once more. ${task.why}`);}
function match(){let opts=task.pairs.map(p=>p[1]);return "<p>Choose the meaning that matches each word.</p><div class='pairs'>"+task.pairs.map((p,i)=>`<label class='word' for='m${i}'>${esc(p[0])}</label><select id='m${i}'><option value=''>Choose a meaning</option>${[...opts].sort(()=>Math.random()-.5).map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join("")}</select>`).join("")+"</div><p><button class='primary' onclick='checkMatch()'>Check matches</button></p><div id='fbmatch' class='feedback' role='status'></div>";}
function checkMatch(){let n=task.pairs.filter((p,i)=>document.getElementById("m"+i).value===p[1]).length,ok=n===task.pairs.length;feedback("fbmatch",ok,ok?"All matches are correct!":`You matched ${n} of ${task.pairs.length} correctly. Check the meanings and try again.`);}
function writing(){return "<p>Write your own answers. There is no single correct personal profile.</p>"+task.prompts.map((p,i)=>`<section class='card'><label for='wr${i}'>${esc(p)}</label><input id='wr${i}' type='text'></section>`).join("")+"<button class='primary' onclick='checkWriting()'>Review my profile</button><div id='fbwriting' class='feedback' role='status'></div>"+checklist(task.checklist,"wc");}
function checkWriting(){let n=task.prompts.filter((_,i)=>document.getElementById("wr"+i).value.trim()).length;feedback("fbwriting",n===task.prompts.length,`You completed ${n} of ${task.prompts.length} sentences. Add your own details, then use the checklist to review your work.`);}
function writingLong(){return "<p>Use these questions to plan your paragraph.</p><ul>"+task.hints.map(h=>`<li>${esc(h)}</li>`).join("")+"</ul><label for='paragraph'>Write 4–5 sentences:</label><textarea id='paragraph' placeholder='My favorite song is...'></textarea><p><button class='primary' onclick='checkParagraph()'>Review my writing</button></p><div id='fbparagraph' class='feedback' role='status'></div>"+checklist(task.checklist,"pc");}
function checkParagraph(){let v=document.getElementById("paragraph").value.trim(),n=v.split(/[.!?]+/).filter(x=>x.trim()).length;feedback("fbparagraph",n>=4,`I can identify about ${n} sentence(s). Aim for 4–5 short sentences, then review the checklist and correct your own work.`);}
function checklist(items,prefix){return "<div class='card'><strong>Self-check</strong>"+items.map((c,i)=>`<label class='option'><input type='checkbox' id='${prefix}${i}'><span>${esc(c)}</span></label>`).join("")+"</div>";}
async function startRecording(){try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});window.audioChunks=[];window.mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>{if(e.data.size)audioChunks.push(e.data)};mediaRecorder.onstop=()=>{let blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||"audio/webm"}),url=URL.createObjectURL(blob),player=document.getElementById("player"),link=document.getElementById("downloadAudio");player.src=url;player.style.display="block";link.href=url;link.style.display="inline-block";link.textContent="Download your recording";stream.getTracks().forEach(t=>t.stop());feedback("recordStatus",null,"Recording ready. Play it back or download it to listen again.");};mediaRecorder.start();document.getElementById("recordBtn").disabled=true;document.getElementById("stopBtn").disabled=false;feedback("recordStatus",null,"Recording… Speak clearly and do not include personal information.");}catch(e){feedback("recordStatus",false,"Microphone access is unavailable or was denied. You can still rehearse the dialogue without recording.");}}
function stopRecording(){if(window.mediaRecorder&&mediaRecorder.state!=="inactive")mediaRecorder.stop();document.getElementById("recordBtn").disabled=false;document.getElementById("stopBtn").disabled=true;}
function record(){return `<div class="audio-box"><strong>Dialogue model</strong><ol>${task.model.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><button class="primary" onclick="speak(task.model.join(' '))">▶ Listen to the model</button></div><p>Rehearse with a partner. Recording is optional and requires microphone permission.</p><div class="toolbar"><button class="primary" id="recordBtn" onclick="startRecording()">● Start recording</button><button class="secondary" id="stopBtn" onclick="stopRecording()" disabled>■ Stop recording</button></div><div id="recordStatus" class="feedback neutral" role="status" style="display:block">No recording yet. You can complete the task without recording.</div><audio id="player" controls style="display:none;width:100%;margin-top:12px"></audio><p><a id="downloadAudio" style="display:none" download="music-dialogue-practice.webm">Download your recording</a></p>${checklist(task.checklist,"rc")}`;}
function renderBody(){switch(task.type){case"quiz":return quiz();case"textcheck":return textcheck();case"tf":return tf();case"multiselect":return multiselect();case"match":return match();case"writing":return writing();case"writing_long":return writingLong();case"record":return record();default:return "<p>Activity type not found.</p>";}}
app.innerHTML=header()+`<div class="panel"><span class="tag">${esc(task.section)}</span><h2>${esc(task.title)}</h2><p>${esc(task.desc)}</p>${task.passage?`<section class="card"><h3>My Favorite Song</h3><p>${esc(task.passage)}</p></section>`:""}${renderBody()}<div class="footer">A1–A2 · UDL-informed · Accessible text and audio options</div></div>`;
</script></body></html>
